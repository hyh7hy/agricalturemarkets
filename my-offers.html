<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Offers — AgriMarket</title>
<link rel="stylesheet" href="css/main.css">
<link rel="stylesheet" href="css/marketplace.css">
<link rel="stylesheet" href="css/dashboard.css">
</head>
<body>
<header class="site-header">
  <div class="container">
    <a href="index.html" class="brand"><span class="brand-mark">🌾</span>AgriMarket</a>
    <nav class="header-nav" style="margin-left:auto">
      <a href="index.html" data-nav-link>Home</a>
      <a href="my-offers.html" data-nav-link class="active">My Offers</a>
      <a href="saved.html" data-nav-link>Saved</a>
      <a href="support.html" data-nav-link>Support</a>
    </nav>
  </div>
</header>

<main class="container" id="page-body">
  <div id="gate-notice" style="display:none" class="gate-notice">
    <h3>Sign in to view your offers</h3>
    <a href="login.html" class="btn btn-primary">Sign in</a>
  </div>

  <div id="dash" style="display:none">
    <div class="page-head"><h1>My Offers</h1><p class="text-muted">Manage your listings and see how they're performing.</p></div>
    <div class="stat-cards">
      <div class="stat-card"><div class="num" id="stat-total">0</div><div class="lbl">Total Offers</div></div>
      <div class="stat-card"><div class="num" id="stat-views">0</div><div class="lbl">Total Views</div></div>
      <div class="stat-card"><div class="num" id="stat-reveals">0</div><div class="lbl">Phone Reveals</div></div>
      <div class="stat-card"><div class="num" id="stat-active">0</div><div class="lbl">Active Offers</div></div>
    </div>
    <div class="dash-list" id="dash-list"></div>
  </div>
</main>

<nav class="bottom-nav" aria-label="Primary mobile">
  <a href="index.html" data-nav-link><span class="bn-icon">🏠</span>Home</a>
  <a href="index.html#search" data-nav-link><span class="bn-icon">🔎</span>Search</a>
  <a href="post-offer.html" class="post-btn"><span class="bn-icon">➕</span>Post</a>
  <a href="my-offers.html" data-nav-link class="active"><span class="bn-icon">📊</span>My Offers</a>
  <a href="profile.html" data-nav-link><span class="bn-icon">👤</span>Profile</a>
</nav>

<script type="module">
import { requireAuth } from "./js/auth.js";
import { listOffersByOwner, setOfferStatus, deleteOffer } from "./js/offers.js";
import { getProduct, placeholderFor } from "./js/products.js";
import { toast, escapeHtml } from "./js/app.js";

let uid = null;

requireAuth({
  onReady: (user) => { uid = user.uid; document.getElementById("dash").style.display = "block"; load(); },
  onSignedOut: () => document.getElementById("gate-notice").style.display = "block",
  onIncompleteProfile: () => document.getElementById("gate-notice").style.display = "block"
});

async function load() {
  const list = document.getElementById("dash-list");
  list.innerHTML = `<div class="skeleton" style="height:78px"></div><div class="skeleton" style="height:78px"></div>`;
  let offers = [];
  try { offers = await listOffersByOwner(uid); } catch (e) { toast("We couldn't connect. Please check your internet connection and try again.", "error"); }

  document.getElementById("stat-total").textContent = offers.length;
  document.getElementById("stat-views").textContent = offers.reduce((s, o) => s + (o.views || 0), 0);
  document.getElementById("stat-reveals").textContent = offers.reduce((s, o) => s + (o.phoneReveals || 0), 0);
  document.getElementById("stat-active").textContent = offers.filter(o => o.status === "active").length;

  if (!offers.length) {
    list.innerHTML = `<div class="empty-state"><div class="emoji">📭</div><h3>You haven't posted an offer yet.</h3><a href="post-offer.html" class="btn btn-primary">Post your first offer</a></div>`;
    return;
  }

  list.innerHTML = offers.map(rowHtml).join("");
  bindRowEvents();
}

function rowHtml(o) {
  const product = getProduct(o.productId) || { category: o.category };
  return `
  <div class="dash-row" data-id="${o.id}">
    <img src="${product.image || placeholderFor(product)}" onerror="this.src='${placeholderFor(product)}'" alt="">
    <div class="info">
      <div class="t1">${escapeHtml(o.productName)} <span class="badge ${o.status==='active'?'badge-active':'badge-sold'}">${o.status}</span></div>
      <div class="t2">${o.pricePerKg} ETB/kg · ${o.quantity} ${o.unit}</div>
      <div class="metrics"><span>👁 ${o.views||0}</span><span>📞 ${o.phoneReveals||0}</span></div>
    </div>
    <div class="actions">
      <a href="offer.html?id=${o.id}" class="btn btn-sm btn-outline">View</a>
      ${o.status === "active" ? `<button class="btn btn-sm btn-outline" data-action="pause">Pause</button><button class="btn btn-sm btn-outline" data-action="sold">${o.ownerRole==='seller'?'Mark sold':'Mark fulfilled'}</button>` : ""}
      ${o.status === "paused" ? `<button class="btn btn-sm btn-outline" data-action="activate">Reactivate</button>` : ""}
      <button class="btn btn-sm btn-danger" data-action="delete">Delete</button>
    </div>
  </div>`;
}

function bindRowEvents() {
  document.querySelectorAll(".dash-row").forEach(row => {
    const id = row.dataset.id;
    row.querySelectorAll("[data-action]").forEach(btn => {
      btn.addEventListener("click", async () => {
        const action = btn.dataset.action;
        try {
          if (action === "pause") await setOfferStatus(id, "paused");
          if (action === "activate") await setOfferStatus(id, "active");
          if (action === "sold") await setOfferStatus(id, "sold");
          if (action === "delete") {
            if (!confirm("Delete this offer? This can't be undone from the marketplace.")) return;
            await deleteOffer(id);
          }
          toast("Updated.");
          load();
        } catch (e) { toast("Something went wrong. Please try again.", "error"); }
      });
    });
  });
}
</script>
</body>
</html>
