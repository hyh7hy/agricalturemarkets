<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in — AgriMarket</title>
<link rel="stylesheet" href="css/main.css">
<link rel="stylesheet" href="css/auth.css">
</head>
<body>
<div class="auth-wrap">
  <div class="auth-card surface pad-lg">
    <a href="index.html" class="brand"><span class="brand-mark">🌾</span>AgriMarket</a>
    <div class="auth-head">
      <h1 style="font-size:1.5rem">Welcome back</h1>
      <p>Sign in to compare offers and manage your listings.</p>
    </div>

    <form id="login-form" novalidate>
      <div class="field" id="f-email">
        <label for="email">Email</label>
        <input type="email" id="email" autocomplete="email" required>
        <div class="error-msg">Please enter a valid email address.</div>
      </div>
      <div class="field" id="f-password">
        <label for="password">Password</label>
        <input type="password" id="password" autocomplete="current-password" required>
        <div class="error-msg">Please enter your password.</div>
      </div>
      <div style="text-align:right;margin-bottom:16px">
        <a href="#" id="forgot-link" style="font-size:.85rem;font-weight:700;color:var(--forest-700)">Forgot password?</a>
      </div>
      <button type="submit" class="btn btn-primary btn-block" id="signin-btn">Sign In</button>
    </form>

    <div class="auth-divider">or</div>
    <button class="btn btn-google btn-block" id="google-btn">
      <svg width="18" height="18" viewBox="0 0 18 18"><path fill="#4285F4" d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84a4.14 4.14 0 0 1-1.8 2.72v2.26h2.9c1.7-1.57 2.7-3.88 2.7-6.62z"/><path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.9-2.26c-.8.54-1.84.86-3.06.86-2.35 0-4.34-1.59-5.05-3.72H.94v2.33A9 9 0 0 0 9 18z"/><path fill="#FBBC05" d="M3.95 10.7a5.4 5.4 0 0 1 0-3.4V4.97H.94a9 9 0 0 0 0 8.06l3.01-2.33z"/><path fill="#EA4335" d="M9 3.58c1.32 0 2.5.45 3.44 1.35l2.58-2.58C13.46.9 11.43 0 9 0A9 9 0 0 0 .94 4.97L3.95 7.3C4.66 5.17 6.65 3.58 9 3.58z"/></svg>
      Continue with Google
    </button>

    <p class="auth-foot">Don't have an account? <a href="signup.html">Create one</a></p>
  </div>
</div>

<script type="module">
import { logInWithEmail, signInWithGoogle, resetPassword, friendlyAuthError } from "./js/auth.js";
import { toast } from "./js/app.js";

const form = document.getElementById("login-form");
const btn = document.getElementById("signin-btn");

form.addEventListener("submit", async (e) => {
  e.preventDefault();
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;
  if (!email || !password) { toast("Please fill in both fields.", "error"); return; }
  btn.disabled = true; btn.innerHTML = '<span class="spinner"></span> Signing in…';
  try {
    await logInWithEmail(email, password);
    location.href = "index.html";
  } catch (err) {
    toast(friendlyAuthError(err), "error");
    btn.disabled = false; btn.textContent = "Sign In";
  }
});

document.getElementById("google-btn").addEventListener("click", async () => {
  try {
    const { isNewProfile, user } = await signInWithGoogle();
    location.href = isNewProfile ? `signup.html?complete=1&uid=${user.uid}` : "index.html";
  } catch (err) {
    toast(friendlyAuthError(err), "error");
  }
});

document.getElementById("forgot-link").addEventListener("click", async (e) => {
  e.preventDefault();
  const email = document.getElementById("email").value.trim();
  if (!email) { toast("Enter your email above first, then tap 'Forgot password?'.", "error"); return; }
  try {
    await resetPassword(email);
    toast("Password reset email sent. Check your inbox.");
  } catch (err) {
    toast(friendlyAuthError(err), "error");
  }
});
</script>
</body>
</html>
